# ─────────────────────────────────────────────────────────────────────────────
# pyproject.toml  — Configuración de build para Flet (APK Android)
#
# Comando de build:
#   flet build apk --project MarcadorAsistencia --org com.tuempresa --arch arm64-v8a --yes
#
# Los permisos declarados aquí se inyectan automáticamente en
# AndroidManifest.xml. No es necesario agregarlos en el CLI.
# ─────────────────────────────────────────────────────────────────────────────

[tool.flet]
# Nombre visible de la app en el lanzador de Android
product = "Control de Asistencia"
description = "Kiosko de marcado de asistencia con cámara"

# Permisos multiplataforma (cross-platform shorthand de Flet)
# "camera"  → CAMERA en Android + NSCameraUsageDescription en iOS
permissions = ["camera"]

# OpenCV (opencv-python) necesita .py del wheel (p. ej. cv2/config.py). Compilar site-packages
# rompe el import en APK (Flet issue #4850).
[tool.flet.compile]
app = true
packages = false
cleanup = true

# ─────────────────────────────────────────────────────────────────────────────
# Permisos Android explícitos
# Útil cuando el shorthand de Flet no incluye todos los permisos necesarios.
# ─────────────────────────────────────────────────────────────────────────────
[tool.flet.android.permission]
# Acceso a hardware de cámara (requerido por OpenCV VideoCapture)
"android.permission.CAMERA" = true

# Acceso a internet (para llamar a la API FastAPI)
"android.permission.INTERNET" = true

# Acceso al estado de la red (opcional, permite detectar si hay conectividad)
"android.permission.ACCESS_NETWORK_STATE" = true

# Cola offline en Documentos / almacenamiento compartido (mejor soporte en tablets kiosco).
# En API recientes el acceso completo puede seguir limitado sin permisos extra del fabricante.
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true

# ─────────────────────────────────────────────────────────────────────────────
# Features de hardware Android
# Declara que la cámara es REQUERIDA (android:required=true).
# Cambia a false si quieres que la app también se instale en tablets sin cámara.
# ─────────────────────────────────────────────────────────────────────────────
[tool.flet.android.feature]
"android.hardware.camera" = true
"android.hardware.camera.autofocus" = false   # opcional, no bloquea instalación
